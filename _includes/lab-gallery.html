<div class="lab-gallery-section">
<h3 class="subsection-title">Lab Photos</h3>
<div class="lab-gallery-container">
<button class="gallery-nav gallery-prev" onclick="scrollGallery(-1)" aria-label="Previous">‹</button>
<div class="lab-gallery" id="labGallery">
<!-- Photos shown newest first (reverse chronological). ADD NEW PHOTOS AT THE TOP. -->
<div class="gallery-item" data-label="Jul 2026">
<img src="/static/img/lab/lab_2026c.jpg" alt="Lab photo 2026 - Kostis' thesis" onerror="this.parentElement.style.display='none';">
</div>
<div class="gallery-item" data-label="Feb 2026">
<img src="/static/img/lab/lab_2026b.jpg" alt="Lab photo 2026" onerror="this.parentElement.style.display='none';">
</div>
<div class="gallery-item" data-label="Feb 2026">
<img src="/static/img/lab/lab_2026a.jpg" alt="Lab photo 2026" onerror="this.parentElement.style.display='none';">
</div>
</div>
<button class="gallery-nav gallery-next" onclick="scrollGallery(1)" aria-label="Next">›</button>
</div>
<p class="gallery-hint">← Scroll to see more photos →</p>
</div>

<script>
function scrollGallery(direction) {
    var gallery = document.getElementById('labGallery');
    gallery.scrollBy({ left: direction * 320, behavior: 'smooth' });
}

// Arrows and the "scroll" hint only when the photos do not all fit
(function(){
    var gallery = document.getElementById('labGallery');
    if (!gallery) return;
    var section = gallery.closest('.lab-gallery-section');
    function update(){
        var overflow = gallery.scrollWidth > gallery.clientWidth + 4;
        section.querySelectorAll('.gallery-nav, .gallery-hint').forEach(function(el){ el.style.display = overflow ? '' : 'none'; });
    }
    window.addEventListener('load', update);
    window.addEventListener('resize', update);
})();
</script>
