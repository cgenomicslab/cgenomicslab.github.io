---
title: News
layout: default
group: news
---

<div class="container">
<section class="page">

<h1 class="section-title">News</h1>

{% for post in site.posts %}
<div class="news-item">
<div class="news-date">{{ post.date | date: "%B %d, %Y" }}</div>
<div class="news-title"><a href="{{ post.url }}">{{ post.title }}</a></div>
</div>
{% endfor %}

{% if site.posts.size == 0 %}
<p style="color: #888;">No news yet. Check back soon!</p>
{% endif %}

<a href="/" class="section-link">← Back to home</a>

</section>
</div>
