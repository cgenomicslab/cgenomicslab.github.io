name: "CGLab"
description: "Comparative Genomics Lab @ IMBB-FORTH"

url: "https://cgenomicslab.org"

# Pagination for news
paginate: 5
plugins: [jekyll-paginate]
paginate_path: "news/page:num"

permalink: pretty
markdown: kramdown
kramdown:
  parse_block_html: true

# Exclude from build
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - scripts/
  # stray/backup files that must not be published
  - static/img/members/index.md
  - static/css/main_backp.css

# Visitor counting (GoatCounter). "code" is the first part of the GoatCounter
# address (CODE.goatcounter.com); leave it empty to disable counting.
# The code is public; the API key is NOT stored here — it lives in the
# repository secret GOATCOUNTER_API_KEY.
goatcounter:
  code: "cgenomicslab"

# Homepage Research section: "spotlight" (one theme at a time, strip of figures),
# "accordion" (all themes in a row, the active one opens) or "grid" (one row of tiles).
# Themes are edited in _data/research.yml. Compare all three at /preview/.
research_style: spotlight

# Collections - simplified
collections:
  members:
    output: true
  publications:
    output: true
    permalink: /publications/:name/
  posts:
    output: true

# Default front matter
defaults:
  - scope:
      path: ""
      type: "members"
    values:
      layout: "member"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
